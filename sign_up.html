<!DOCTYPE html>
<html>
<head>
    <title>Sign Up Page</title>
    <link rel="stylesheet" type="text/css" href="sign_up.css"/>
</head>

<body>
    <div class="container">
        <h1>Sign Up</h1>

        <input type="text" id="nameInput" placeholder="Enter your name">

        <input type="email" id="mailInput" placeholder="Enter your mail">

        <input type="text" id="userNameInput" placeholder="Enter your user name">

        <input type="text" id="passwordInput" placeholder="Enter your password">

        <button onclick="showText()">Submit</button>

        <div class="output" id="outputBox">
            Your text will appear here.
        </div>
        <script src="sign_up.js"></script>
    </div>
</body>
</html>
